<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Cards</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1 class="text-center mt-4 mb-4">
            My Card Layout
        </h1>

        <div class="row">

            <!-- Card 1 -->
            <div class="col-4">
                <div class="card">
                    <img src="daniyal1.jpeg"card-img-top" alt="Image">

                    <div class="card-body">
                        <h5 class="card-title">Me One</h5>

                        <p class="card-text">
                            This is a simple Bootstrap card example.
                        </p>

                        <a href="#" class="btn btn-primary">
                            Read More
                        </a>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-4">
                <div class="card">
                    <img src="Daniyal2.jpeg" class="card-img-top" alt="Image">

                    <div class="card-body">
                        <h5 class="card-title">Me Two</h5>

                        <p class="card-text">
                            Bootstrap helps create responsive layouts easily.
                        </p>

                        <a href="#" class="btn btn-success">
                            Learn More
                        </a>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-4">
                <div class="card">
                    <img src="Daniyal3.jpeg" class="card-img-top" alt="Image">

                    <div class="card-body">
                        <h5 class="card-title">Me Three</h5>

                        <p class="card-text">
                            Cards are useful for displaying content neatly.
                        </p>

                        <a href="#" class="btn btn-danger">
                            View More
                        </a>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
